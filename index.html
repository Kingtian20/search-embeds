<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paper Mario (USA) - Web Emulator</title>
<script>
window.gameconfig = {
  name: "Paper Mario (USA)",
  url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@69e5df0bdfad91580779ec98ca18841e753145fd/Paper%20Mario%20(USA)%20(2)/Paper%20Mario%20(USA).z64",
  core: "n64",
  min: 1,
  max: 3
};

function getParts(file, start, end){
  let parts = [];
  for(let i=start;i<=end;i++){parts.push(file+".part"+i);}
  return parts;
}

function mergeFiles(fileParts, cb){
  return new Promise((resolve, reject) => {
    let buffers = [];
    function fetchPart(index){
      if(index >= fileParts.length){
        let mergedBlob = new Blob(buffers);
        resolve(URL.createObjectURL(mergedBlob));
        return;
      }
      fetch(fileParts[index])
        .then(r=>{ if(!r.ok) throw new Error(`Failed to fetch ${fileParts[index]} HTTP ${r.status}`); return r.arrayBuffer(); })
        .then(data => { buffers.push(data); cb(index+1); fetchPart(index+1); })
        .catch(reject);
    }
    fetchPart(0);
  });
}

window.isFullscreenTab = new URLSearchParams(window.location.search).has("fullscreen");
</script>
<style>
body, html {
  margin: 0;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background-color: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

#game-container {
  text-align: center;
  width: 100%;
  height: 100%;
}

#loading-progress {
  font-size: 18px;
  margin-top: 20px;
  padding: 10px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  display: inline-block;
}

.button {
  font-size: 20px;
  padding: 12px 24px;
  margin-top: 12px;
  background-color: #0064ff;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: background-color 0.3s;
  display: block;
}

.button:hover {
  background-color: #004bb5;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="game"></div>
  <button id="play-button" class="button">Play Paper Mario</button>
  <button id="fullscreen-button" class="button">Open in New Tab</button>
  <div id="loading-progress" style="display:none;">Loading: 0/0</div>
  <div id="first-time" style="display:none;">First-time loading may take longer...</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const playButton = document.getElementById("play-button");
  const fullscreenButton = document.getElementById("fullscreen-button");
  const loadingProgress = document.getElementById("loading-progress");
  const firstTime = document.getElementById("first-time");

  function startGame() {
    playButton.style.display = "none";
    fullscreenButton.style.display = "none";
    loadingProgress.style.display = "inline-block";
    firstTime.style.display = "block";

    const parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);
    const totalParts = parts.length;

    function updateLoadingProgress(loaded){
      loadingProgress.textContent = `Loading: ${loaded}/${totalParts}`;
    }

    mergeFiles(parts, updateLoadingProgress)
      .then(gameUrl => {
        loadingProgress.remove();
        firstTime.remove();

        EJS_player = "#game";
        EJS_core = window.gameconfig.core;
        EJS_gameName = window.gameconfig.name;
        EJS_color = "#0064ff";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
        EJS_gameUrl = gameUrl;

        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
        document.body.appendChild(script);
      })
      .catch(error => {
        console.error(error);
        loadingProgress.textContent = "Error loading game.";
      });
  }

  if (window.isFullscreenTab) {
    startGame();
  }

  playButton.addEventListener("click", startGame);
  fullscreenButton.addEventListener("click", () => {
    window.open(window.location.href + "?fullscreen=true", "_blank");
  });
});
</script>
</body>
</html>
